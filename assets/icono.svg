<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Pez de circuitos">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0e3a52"/>
      <stop offset="0.55" stop-color="#06202f"/>
      <stop offset="1" stop-color="#020a12"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2694ad"/>
      <stop offset="0.5" stop-color="#12617a"/>
      <stop offset="1" stop-color="#0a3546"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5fe6d8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5fe6d8" stop-opacity="0"/>
    </radialGradient>
    <!-- malla de la red, tenue: se reconoce sin competir con el pez -->
    <pattern id="malla" width="46" height="46" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45 0 0)">
      <path d="M23 0 V46 M0 23 H46" stroke="#5fe6d8" stroke-width="1.6"
            opacity="0.16" fill="none"/>
      <circle cx="23" cy="23" r="2.6" fill="#9ffaee" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#malla)"/>
  <ellipse cx="256" cy="262" rx="215" ry="140" fill="url(#halo)"/>

  <g transform="translate(262 262)">
    <!-- aletas -->
    <path d="M-16 -50 L 26 -100 L 62 -46 Z" fill="#0d4a60" stroke="#3fd8c8" stroke-width="4"/>
    <path d="M8 32 L -6 82 L 54 50 Z" fill="#0d4a60" stroke="#3fd8c8" stroke-width="4"/>
    <path d="M-112 0 L -178 -54 L -155 0 L -178 54 Z" fill="#0d4a60"
          stroke="#3fd8c8" stroke-width="4.5"/>

    <!-- cuerpo -->
    <path d="M-112 0 C -82 -52, 46 -62, 102 -12 C 108 -6, 108 6, 102 12
             C 46 62, -82 52, -112 0 Z"
          fill="url(#cuerpo)" stroke="#8ff6e8" stroke-width="6"/>

    <!-- trazas de circuito -->
    <g fill="none" stroke="#4fe4d2" stroke-width="4" opacity="0.95"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M-84 -8 H -54 V -30 H -10 V -8 H 30"/>
      <path d="M-70 16 H -26 V 36 H 24 V 14 H 60"/>
      <path d="M30 -8 V -32 H 68"/>
    </g>
    <g fill="#9ffaee">
      <rect x="-60" y="-36" width="11" height="11" rx="2"/>
      <rect x="24"  y="-14" width="11" height="11" rx="2"/>
      <rect x="18"  y="10"  width="11" height="11" rx="2"/>
    </g>
    <g fill="#ffbe5c">
      <rect x="-16" y="-14" width="11" height="11" rx="2"/>
      <rect x="64"  y="-38" width="11" height="11" rx="2"/>
    </g>

    <!-- chip -->
    <rect x="-42" y="-18" width="38" height="34" rx="4" fill="#062533"
          stroke="#4fe4d2" stroke-width="4"/>
    <g stroke="#4fe4d2" stroke-width="3" opacity="0.85">
      <path d="M-42 -10 H -52 M-42 0 H -52 M-42 10 H -52"/>
      <path d="M-4 -10 H 6 M-4 0 H 6 M-4 10 H 6"/>
    </g>

    <!-- branquia -->
    <path d="M60 -26 C 72 -10, 72 10, 60 26" fill="none" stroke="#4fe4d2"
          stroke-width="4" opacity="0.85"/>

    <!-- ojo -->
    <circle cx="80" cy="-12" r="20" fill="#ffbe5c" opacity="0.2"/>
    <circle cx="80" cy="-12" r="16" fill="#041820" stroke="#8ff6e8" stroke-width="4.5"/>
    <circle cx="80" cy="-12" r="7" fill="#ffbe5c"/>
    <circle cx="84" cy="-16" r="2.6" fill="#ffffff"/>

    <!-- boca -->
    <path d="M104 10 C 97 18, 88 20, 80 19" fill="none" stroke="#4fe4d2" stroke-width="4"/>
  </g>
</svg>
