<!-- preserveAspectRatio="none": se usa como fondo CSS estirado al alto de la
     tarjeta, y sin esto el dibujo conservaría su proporción y quedaría
     centrado, dejando huecos arriba y abajo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 420" width="44" height="420"
     preserveAspectRatio="none" role="img" aria-label="Caña de pescar">
  <defs>
    <linearGradient id="corcho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2c493"/>
      <stop offset="0.45" stop-color="#b98f57"/>
      <stop offset="1" stop-color="#7a5a30"/>
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2f2f6"/>
      <stop offset="0.5" stop-color="#93b3bd"/>
      <stop offset="1" stop-color="#41606c"/>
    </linearGradient>
    <linearGradient id="grafito" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a7d8f"/>
      <stop offset="0.35" stop-color="#245367"/>
      <stop offset="1" stop-color="#0c2531"/>
    </linearGradient>
  </defs>

  <!-- el mismo dibujo horizontal, girado 90 grados para llenar el lienzo vertical -->
  <g transform="translate(44 0) rotate(90)">
    <path d="M118 10 C 210 12, 330 16, 404 17.5
             A 4.5 4.5 0 0 1 404 26.5
             C 330 28, 210 32, 118 34 Z"
          fill="url(#grafito)" stroke="#08202b" stroke-width="1.6"/>
    <path d="M122 13 C 212 15, 332 19, 402 20" fill="none" stroke="#9ed6e4"
          stroke-width="1.6" opacity="0.35"/>
    <path d="M122 24 C 212 25, 332 24, 402 23.5" fill="none" stroke="#5fe6d8"
          stroke-width="2" opacity="0.8"/>

    <g stroke="#9ec4cf" stroke-width="1.6" fill="none">
      <path d="M186 13 L184 8"/><ellipse cx="183" cy="6" rx="4" ry="3.2"/>
      <path d="M252 14 L250 9.5"/><ellipse cx="249" cy="7.5" rx="3.5" ry="2.8"/>
      <path d="M316 16 L315 11.5"/><ellipse cx="314" cy="9.8" rx="3" ry="2.4"/>
      <path d="M372 17 L371 13"/><ellipse cx="370" cy="11.5" rx="2.6" ry="2"/>
    </g>

    <rect x="96" y="8" width="30" height="28" rx="6" fill="url(#acero)"
          stroke="#2f4652" stroke-width="1.5"/>
    <circle cx="111" cy="22" r="5" fill="#08222c" stroke="#5fe6d8" stroke-width="1.8"/>
    <circle cx="111" cy="22" r="2" fill="#9ffaee"/>

    <rect x="4" y="7" width="96" height="30" rx="13" fill="url(#corcho)"
          stroke="#5c421f" stroke-width="1.6"/>
    <g fill="#8a6a3c" opacity="0.5">
      <circle cx="20" cy="15" r="1.9"/><circle cx="34" cy="27" r="1.6"/>
      <circle cx="48" cy="14" r="1.7"/><circle cx="62" cy="28" r="1.8"/>
      <circle cx="76" cy="17" r="1.5"/><circle cx="88" cy="27" r="1.6"/>
      <circle cx="28" cy="31" r="1.4"/><circle cx="56" cy="20" r="1.3"/>
      <circle cx="70" cy="10" r="1.3"/>
    </g>
    <rect x="8" y="11" width="88" height="5" rx="2.5" fill="#f2dcb6" opacity="0.35"/>
  </g>
</svg>
