<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Un pez de circuitos atrapado en una red neuronal</title>
  <desc id="desc">Ilustración original: en aguas profundas, un pez formado por trazas de circuito impreso queda atrapado en una red de pesca cuyos nudos son nodos luminosos de una red neuronal. Al fondo, ecos de sonar y un pequeño grafo de neuronas.</desc>

  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2b3e"/>
      <stop offset="0.45" stop-color="#061a29"/>
      <stop offset="1" stop-color="#020a12"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe6d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5fe6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2694ad"/>
      <stop offset="0.5" stop-color="#12617a"/>
      <stop offset="1" stop-color="#0a3546"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9ee"/>
      <stop offset="0.5" stop-color="#7fa5b0"/>
      <stop offset="1" stop-color="#3d5a66"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5fe6d8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5fe6d8" stop-opacity="0"/>
    </radialGradient>

    <!-- La malla: rombos como los de una red de pesca, con un nodo luminoso en
         cada nudo. Es exactamente la misma figura que un grafo neuronal. -->
    <pattern id="malla" width="38" height="38" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45 0 0)">
      <path d="M19 0 V38 M0 19 H38" stroke="#5fe6d8" stroke-width="1.3"
            opacity="0.42" fill="none"/>
      <circle cx="19" cy="19" r="5" fill="#3fd8c8" opacity="0.14"/>
      <circle cx="19" cy="19" r="2.3" fill="#9ffaee" opacity="0.9"/>
      <circle cx="0"  cy="0"  r="2.3" fill="#9ffaee" opacity="0.9"/>
      <circle cx="38" cy="0"  r="2.3" fill="#9ffaee" opacity="0.9"/>
      <circle cx="0"  cy="38" r="2.3" fill="#9ffaee" opacity="0.9"/>
      <circle cx="38" cy="38" r="2.3" fill="#9ffaee" opacity="0.9"/>
    </pattern>

    <!-- retícula tenue de datos al fondo -->
    <pattern id="reticula" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4fd9ca" opacity="0.16"/>
    </pattern>

    <path id="bolsa" d="M287 216
                        C 296 316, 398 372, 474 354
                        C 552 336, 588 232, 573 124
                        C 520 168, 344 200, 287 216 Z"/>
  </defs>

  <!-- ================= FONDO ================= -->
  <rect width="800" height="400" fill="url(#agua)"/>
  <rect width="800" height="400" fill="url(#reticula)"/>

  <!-- rayos de luz desde la superficie -->
  <g>
    <path d="M120 0 L192 0 L268 400 L172 400 Z" fill="url(#rayo)"/>
    <path d="M330 0 L372 0 L410 400 L352 400 Z" fill="url(#rayo)" opacity="0.75"/>
    <path d="M620 0 L690 0 L742 400 L654 400 Z" fill="url(#rayo)" opacity="0.6"/>
  </g>

  <!-- ecos de sonar -->
  <g fill="none" stroke="#3fd8c8" stroke-linecap="round">
    <path d="M8 372 A 72 72 0 0 1 152 372"   opacity="0.30" stroke-width="1.6"/>
    <path d="M8 372 A 112 112 0 0 1 232 372" opacity="0.22" stroke-width="1.6"/>
    <path d="M8 372 A 152 152 0 0 1 312 372" opacity="0.14" stroke-width="1.6"/>
    <path d="M8 372 A 192 192 0 0 1 392 372" opacity="0.08" stroke-width="1.6"/>
  </g>
  <circle cx="80" cy="372" r="5" fill="#9ffaee"/>

  <!-- grafo neuronal al fondo -->
  <g opacity="0.5">
    <g stroke="#3fd8c8" stroke-width="1.1" opacity="0.55" fill="none">
      <path d="M60 92 L128 62 M60 92 L128 118 M60 92 L128 168"/>
      <path d="M128 62 L200 88 M128 118 L200 88 M128 168 L200 88"/>
      <path d="M128 62 L200 148 M128 118 L200 148 M128 168 L200 148"/>
    </g>
    <g fill="#9ffaee">
      <circle cx="60" cy="92" r="4"/><circle cx="128" cy="62" r="3.4"/>
      <circle cx="128" cy="118" r="3.4"/><circle cx="128" cy="168" r="3.4"/>
      <circle cx="200" cy="88" r="4"/><circle cx="200" cy="148" r="4"/>
    </g>
  </g>

  <!-- partículas de datos -->
  <g fill="#7ff0e2">
    <rect x="252" y="60"  width="5" height="5" opacity="0.7"/>
    <rect x="308" y="132" width="4" height="4" opacity="0.5"/>
    <rect x="662" y="96"  width="5" height="5" opacity="0.6"/>
    <rect x="716" y="212" width="4" height="4" opacity="0.45"/>
    <rect x="150" y="248" width="4" height="4" opacity="0.5"/>
    <rect x="86"  y="196" width="5" height="5" opacity="0.4"/>
    <rect x="742" y="318" width="4" height="4" opacity="0.4"/>
  </g>
  <g fill="none" stroke="#7ff0e2" opacity="0.35" stroke-width="1.4">
    <circle cx="214" cy="318" r="7"/><circle cx="238" cy="292" r="4.5"/>
    <circle cx="600" cy="70" r="6"/><circle cx="624" cy="48" r="4"/>
    <circle cx="120" cy="150" r="5"/>
  </g>

  <!-- ================= LA RED (interior) ================= -->
  <!-- El fondo de la bolsa va antes que el pez y la malla después: así el pez
       se ve dentro de la red, con los hilos cruzándole por delante. -->
  <use href="#bolsa" fill="#052330" opacity="0.75"/>

  <!-- ================= EL PEZ DE CIRCUITOS ================= -->
  <ellipse cx="438" cy="250" rx="152" ry="88" fill="url(#halo)"/>

  <g transform="translate(438 250) rotate(-9) scale(0.94)">
    <!-- aletas -->
    <path d="M-14 -42 L 22 -84 L 52 -38 Z" fill="#0d4a60" stroke="#3fd8c8" stroke-width="2"/>
    <path d="M6 26 L -4 66 L 44 40 Z" fill="#0d4a60" stroke="#3fd8c8" stroke-width="2"/>
    <path d="M-96 0 L -152 -44 L -132 0 L -152 44 Z" fill="#0d4a60" stroke="#3fd8c8" stroke-width="2.4"/>

    <!-- cuerpo -->
    <path d="M-96 0 C -70 -44, 40 -52, 88 -10 C 93 -5, 93 5, 88 10
             C 40 52, -70 44, -96 0 Z"
          fill="url(#cuerpo)" stroke="#8ff6e8" stroke-width="3.2"/>

    <!-- trazas de circuito impreso -->
    <g fill="none" stroke="#4fe4d2" stroke-width="2" opacity="0.9"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M-72 -6 H -46 V -24 H -8 V -6 H 26"/>
      <path d="M-60 14 H -22 V 30 H 20 V 12 H 52"/>
      <path d="M-16 -6 V 12"/>
      <path d="M26 -6 V -26 H 58"/>
      <path d="M52 12 V 28"/>
    </g>
    <!-- Las vías cálidas son el único color no cian de la escena: separan al
         pez de la red y dan un punto de atención. -->
    <g fill="#9ffaee">
      <rect x="-50" y="-28" width="8" height="8" rx="1.5"/>
      <rect x="22"  y="-10" width="8" height="8" rx="1.5"/>
      <rect x="16"  y="8"   width="8" height="8" rx="1.5"/>
      <rect x="-26" y="26"  width="8" height="8" rx="1.5"/>
    </g>
    <g fill="#ffbe5c">
      <rect x="-12" y="-10" width="8" height="8" rx="1.5"/>
      <rect x="54"  y="-30" width="8" height="8" rx="1.5"/>
      <rect x="48"  y="24"  width="8" height="8" rx="1.5"/>
    </g>

    <!-- «chip» central -->
    <rect x="-34" y="-14" width="30" height="26" rx="3" fill="#062533"
          stroke="#4fe4d2" stroke-width="2"/>
    <g stroke="#4fe4d2" stroke-width="1.6" opacity="0.8">
      <path d="M-34 -8 H -42 M-34 0 H -42 M-34 8 H -42"/>
      <path d="M-4 -8 H 4 M-4 0 H 4 M-4 8 H 4"/>
    </g>

    <!-- branquia -->
    <path d="M52 -22 C 62 -8, 62 8, 52 22" fill="none" stroke="#4fe4d2"
          stroke-width="2.2" opacity="0.8"/>

    <!-- ojo -->
    <circle cx="70" cy="-10" r="14" fill="#ffbe5c" opacity="0.18"/>
    <circle cx="70" cy="-10" r="12" fill="#041820" stroke="#8ff6e8" stroke-width="2.6"/>
    <circle cx="70" cy="-10" r="5.5" fill="#ffbe5c"/>
    <circle cx="73" cy="-13" r="2" fill="#ffffff"/>

    <!-- boca -->
    <path d="M90 8 C 84 14, 76 16, 70 15" fill="none" stroke="#4fe4d2" stroke-width="2.2"/>
  </g>

  <!-- burbujas de datos -->
  <g fill="none" stroke="#9ffaee" stroke-width="1.4" opacity="0.6">
    <circle cx="536" cy="212" r="6"/><circle cx="560" cy="188" r="4"/>
    <circle cx="580" cy="204" r="3"/>
  </g>

  <!-- ================= LA RED (malla, por delante del pez) ================= -->
  <use href="#bolsa" fill="url(#malla)"/>
  <use href="#bolsa" fill="none" stroke="#3fd8c8" stroke-width="2" opacity="0.55"/>

  <!-- aro de la red -->
  <g transform="rotate(-18 430 170)">
    <ellipse cx="430" cy="170" rx="150" ry="48" fill="none"
             stroke="url(#metal)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="430" cy="170" rx="150" ry="48" fill="none"
             stroke="#9ffaee" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- mango, con una traza luminosa recorriéndolo -->
  <g transform="rotate(-18 430 170)">
    <rect x="120" y="160" width="168" height="14" rx="7" fill="url(#metal)"/>
    <rect x="126" y="164" width="150" height="3" rx="1.5" fill="#9ffaee" opacity="0.75"/>
    <circle cx="128" cy="167" r="10" fill="#0d4a60" stroke="#9ffaee" stroke-width="2"/>
    <circle cx="128" cy="167" r="3.5" fill="#9ffaee"/>
  </g>

  <!-- sedal descendiendo desde la superficie -->
  <path d="M300 0 C 318 54, 302 104, 286 152" fill="none"
        stroke="#9ffaee" stroke-width="1.6" opacity="0.55"/>
  <circle cx="286" cy="152" r="4" fill="#9ffaee" opacity="0.8"/>
</svg>
