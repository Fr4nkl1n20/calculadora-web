<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Un león devorando un galeón</title>
  <desc id="desc">Ilustración original: un león dorado de melena escarlata emerge del mar de noche y muerde un galeón de casco azul marino, partiéndolo en dos.</desc>

  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04091a"/>
      <stop offset="0.55" stop-color="#0b1e3d"/>
      <stop offset="1" stop-color="#14375f"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14456f"/>
      <stop offset="1" stop-color="#04101f"/>
    </linearGradient>
    <radialGradient id="brillo">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6bb0"/>
      <stop offset="0.45" stop-color="#143a72"/>
      <stop offset="1" stop-color="#07203f"/>
    </linearGradient>
    <linearGradient id="vela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bccbdf"/>
      <stop offset="0.45" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#cfdcec"/>
    </linearGradient>
    <linearGradient id="pelaje" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fbd57e"/>
      <stop offset="0.55" stop-color="#f0b845"/>
      <stop offset="1" stop-color="#cf9127"/>
    </linearGradient>

    <path id="pua" d="M191 102 L205 20 L219 102 Z"/>
    <path id="pua2" d="M194 118 L205 52 L216 118 Z"/>
  </defs>

  <!-- ================= CIELO ================= -->
  <rect width="800" height="400" fill="url(#cielo)"/>
  <ellipse cx="120" cy="26" rx="230" ry="140" fill="url(#brillo)" opacity="0.32"/>
  <ellipse cx="700" cy="18" rx="200" ry="120" fill="url(#brillo)" opacity="0.28"/>
  <circle cx="700" cy="70" r="74" fill="#ffe9a8" opacity="0.09"/>
  <circle cx="700" cy="70" r="33" fill="#f8efd2"/>
  <circle cx="688" cy="62" r="7" fill="#e0d3ae" opacity="0.7"/>
  <circle cx="711" cy="82" r="5" fill="#e0d3ae" opacity="0.55"/>
